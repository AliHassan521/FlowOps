name: flowops-local
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: Y
      MSSQL_PID: Developer
      MSSQL_MEMORY_LIMIT_MB: "1536"
      MSSQL_SA_PASSWORD: ${FLOWOPS_SA_PASSWORD:?Generate local credentials first}
    mem_limit: 2g
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          CMD-SHELL,
          'SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q "SELECT 1" -b -o /dev/null',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migrator
    environment:
      ConnectionStrings__DefaultConnection: Server=sql,1433;Database=FlowOps;User Id=sa;Password=${FLOWOPS_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True
      FLOWOPS_LOCAL_PROVISION: "true"
      FLOWOPS_LOCAL_RUNTIME_PASSWORD: ${FLOWOPS_DB_PASSWORD:?Generate local credentials first}
    depends_on:
      sql:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: api
    environment:
      # This loopback-only HTTP stack is local development, never a production override.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=sql,1433;Database=FlowOps;User Id=FlowOpsRuntime;Password=${FLOWOPS_DB_PASSWORD};Encrypt=True;TrustServerCertificate=True
      JwtSettings__SecretKey: ${FLOWOPS_JWT_SECRET:?Generate local credentials first}
      JwtSettings__Issuer: FlowOps.Api
      JwtSettings__Audience: FlowOps.Client
      JwtSettings__AccessTokenMinutes: "15"
      JwtSettings__RefreshTokenDays: "30"
      Cors__AllowedOrigins__0: http://localhost:8080
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Warning
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [api]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
volumes:
  sql-data:
